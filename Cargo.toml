[package]
name = "sloth-tui"
version = "0.1.3"
edition = "2024"
rust-version = "1.90.0"
description = "Terminal interface for movies, anime, sports, F1, and live TV — zero cost, always fast."
license = "MIT OR Apache-2.0"
repository = "https://github.com/syedzahidsaleem/sloth-tui.git"
homepage = "https://github.com/syedzahidsaleem/sloth-tui"
readme = "README.md"
categories = ["multimedia::video", "command-line-utilities"]
keywords = ["tui", "streaming", "movies", "anime", "f1"]

[features]
default = ["notifications", "discord"]
discord = ["dep:discord-presence"]
notifications = ["dep:notify-rust"]

[dependencies]
discord-presence = { version = "0.4", optional = true }
notify-rust = { version = "4", optional = true, default-features = false, features = ["z-with-tokio"] }
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui-image = { version = "11.0.0", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "net", "io-util", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies", "stream"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
lru = "0.18"
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
rmp-serde = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"
scraper = "0.20"
fastrand = "2"
percent-encoding = "2.3"
unicode-segmentation = "1"
unicode-width = "0.2"
open = "5"
log = "0.4"
which = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros"] }
tempfile = "3"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[profile.dev]
opt-level = 1
